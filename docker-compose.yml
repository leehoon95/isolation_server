services:
  # 1. Redis 인스턴스 설정
  redis:
    image: redis:7-alpine
    container_name: isolation-redis
    restart: always
    # 같은 docker 네트워크 안에서 연결된 다른 컨테이너에게 공개할 포트(내부 통신용)
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - game-net
    # 서버 프로그램보다 Redis가 완전히 켜질 때까지 기다리기 위한 헬스체크
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 10

  # 2. 서버 프로그램 컨테이너 설정
  server:
    image: ${DOCKERHUB_IMAGE}
    container_name: isolation-server
    environment:
      - ISOLATION_SERVER_LISTENING_PORT=${SERVER_LISTENING_PORT}
    restart: unless-stopped
    # Redis가 헬스체크(ping)에 성공한 후 서버 프로그램 실행
    depends_on:
      redis:
        condition: service_healthy
    # host os와 컨테이너를 연결할 포트
    ports:
      - "${SERVER_LISTENING_PORT}:${SERVER_LISTENING_PORT}" # 게임/웹 서버의 서비스 포트
    networks:
      - game-net

# 사용자 정의 브리지 네트워크. 격리된 도커 네트워크
networks:
  game-net:
    driver: bridge

# Redis 데이터 영구 보존을 위한 볼륨
volumes:
  redis-data: