name: Deploy EC2 via Pulumi and Run docker-compose

on:
  workflow_dispatch:

# GitHub OIDC 토큰 발급을 위해 필요
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  PULUMI_STACK: dev          # 실제 스택 이름으로 변경
  PULUMI_WORKDIR: ./infra/pulumi     # Pulumi 프로젝트 디렉토리로 변경

jobs:
  deploy-infra:
    name: Pulumi로 EC2 생성
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.stack-output.outputs.instance_ip }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          ref: develop

      # --- AWS OIDC 인증 ---
      - name: AWS 자격 증명 구성 (OIDC)
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::984445751003:role/PulumiDevAccessRole
          aws-region: ${{ env.AWS_REGION }}
          run: |
            # Your commands that require AWS credentials
            aws sts get-caller-identity
      # --- AWS 로컬 인증 ---
      - name: AWS 자격 증명 구성 (로컬 act)
        if: ${{ env.ACT }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # dotnet 8.0 설치
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # --- Pulumi 실행 ---
      - name: Pulumi up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: ${{ env.PULUMI_WORKDIR }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # --- 생성된 인스턴스의 Public IP를 stack output에서 추출 ---
      - name: Pulumi stack output 조회
        id: get-ip
        working-directory: ${{ env.PULUMI_WORKDIR }}
        run: |
          IP=$(pulumi stack output publicElasticIp --stack ${{ env.PULUMI_STACK }})
          echo "instance_ip=$IP" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Wait for SSH port to open
        run: |
          for i in {1..30}; do
            if nc -z -w5 "${{ steps.get-ip.outputs.elastic_ip }}" 22; then
              echo "SSH is up"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done
      - name: Check for test directory
        run: ls -al

 