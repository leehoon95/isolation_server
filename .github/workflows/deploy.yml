name: Deploy to Cloud Instance

# Github-hosted 러너를 사용한다. 
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: true

      # Github 원격 캐시 스토리지와 통신해서 빠른 빌드 가능
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/isolation-server:${{ github.sha }}

      - name: Copy docker-compose.yml to Server via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INSTANCE_HOST }}
          username: ${{ secrets.INSTANCE_USER }}
          key: ${{ secrets.INSTANCE_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.INSTANCE_USER }}/server-app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INSTANCE_HOST }}
          username: ${{ secrets.INSTANCE_USER }}
          key: ${{ secrets.INSTANCE_SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.INSTANCE_USER }}/server-app
            docker compose down
            docker compose pull
            docker compose up -d

            