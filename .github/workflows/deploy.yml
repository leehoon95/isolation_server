name: Deploy to Cloud Instance

# Github-hosted 러너를 사용한다. 
on:
  workflow_dispatch:
  
env:
  AWS_EC2_INSTANCE_USERNAME: ubuntu

jobs:
  call-deploy-infra:
    uses: ./.github/workflows/deploy-aws-infra.yml

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: true

      # Github 원격 캐시 스토리지와 통신해서 빠른 빌드 가능
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/isolation-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to Server via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ needs.call-deploy-infra.outputs.instance_ip }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.AWS_EC2_USERNAME }}/server"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.call-deploy-infra.outputs.instance_ip }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.AWS_EC2_USERNAME }}/server
            docker compose down
            DOCKER_IMAGE_TAG=${{ github.sha }} docker compose pull
            DOCKER_IMAGE_TAG=${{ github.sha }} docker compose up -d
            docker image prune -f

            
